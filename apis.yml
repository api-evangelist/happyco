aid: happyco
name: HappyCo
description: >-
  HappyCo is a PropTech company (founded 2011, San Diego) whose real-time
  multifamily operations platform powers property inspections, AI-led
  maintenance, centralized maintenance, and asset performance for nearly 4
  million units globally. Its developer-facing Happy API is a high-performance
  gRPC API (grpc.happyco.com) exposing inspection, report, template, account,
  account-provisioning (Partner API), asset, and folder services, plus
  server-streaming event notifications and a flexible MyID/IntegrationID system.
  Generated client libraries are published for Ruby, Go, and Java, and the
  platform integrates with major property-management systems (Yardi, RealPage,
  Entrata, MRI, ResMan, AppFolio, Buildium).
